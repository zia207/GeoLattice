[project.urls]
Homepage = "https://github.com/zia207/GeoLattice"
Repository = "https://github.com/zia207/GeoLattice"
"Bug Tracker" = "https://github.com/zia207/GeoLattice/issues"
Changelog = "https://github.com/zia207/GeoLattice/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
# Nested package list is built in setup.py so ``geolattice.geostatistics``
# (core, kriging, simulation, and the other subpackages),
# ``geolattice.spatial_statistics``, ``geolattice.spatial_analysis.spatialcausal``, ``geolattice.spatial_bd`` (``geolattice.geolatticedb``), ``geolattice.rsense`` (with its
# ``apps/templates`` namespace package), and the rest of ``src/`` map into the
# ``geolattice`` namespace.
package-dir = {"geolattice" = "src", "pygis" = "compat/pygis"}

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=geolattice --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
