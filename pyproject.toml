# ---------------------------------------------------------------------------
# Installation options. Each option includes everything in the one before it.
#   pip install "geolattice[core]"            1. vector, raster, CRS, visualization
#   pip install "geolattice[analysis]"        2. + spatial analysis
#   pip install "geolattice[statistics]"      3. + spatial statistics and spatial causal inference
#   pip install "geolattice[geostats]"        4. + geostatistics
#   pip install "geolattice[remote-sensing]"  5. + remote sensing
#   pip install "geolattice[all]"             6. everything (web/cloud GIS, spatial databases, deep learning, ...)
# Not in "all": GPU builds for CUDA 13 (compute, geostatistics-gpu, rsense-gpu), rsense-biopar (needs pandas<3),
# geostatistics-h2o / geostatistics-tensorflow, rsense-uav-dl, rsense-vision, rsense-foundation and dev. Add them by name.
# ---------------------------------------------------------------------------

