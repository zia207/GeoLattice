[build-system]
requires = ["setuptools>=77", "wheel", "numpy>=1.21.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geolattice"
version = "0.3.49"
description = "Geospatial analysis with CRS tools, vector and raster I/O, basic raster operations, terrain analysis, surface hydrology, multi-criteria suitability analysis (fuzzy / WLC / C kernels), multidimensional rasters, spatial network analysis, segregation analysis, geostatistics (variograms, kriging, simulation, JAX CPU/GPU variograms and kriging), spatial statistics (ESDA, spatial weights, GWR/MGWR, point patterns, spatial regression, sampling, Bayesian disease mapping), spatial causal inference (interference, spatial confounding, spatial DML, geographic RDD / DiD, causal discovery), web and cloud GIS (COG, GeoParquet, PMTiles, XYZ tiles, OGC API Features), spatial databases (PostGIS, SpatiaLite, GeoPackage, DuckDB spatial SQL, PostGIS raster, pgRouting, vector tiles), remote sensing (optical indices and compositing, satellite image super-resolution, texture analysis, NISAR HDF5 products, SAR flood mapping, InSAR, lidar (point cloud filtering, tiling, ground classification, forest, urban, hydrology, change detection, registration, PointNet++), hyperspectral (ENVI/EMIT/EnMAP/PRISMA I/O, MNF, continuum removal, unmixing, target and methane detection, PLSR/PROSAIL traits), foundation models (Prithvi, Clay, DOFA, CROMA, Copernicus-FM, Panopticon, TerraMind, AnySat, SSL4EO, Satlas, Scale-MAE, RemoteCLIP, AlphaEarth embeddings), UAV, time series, fusion, deep learning, image classification, segmentation, object detection and change detection, XAI), distributed and GPU computing (chunked raster and partitioned vector processing, zonal statistics, spatial statistics, networks and machine learning on Dask clusters, CUDA GPUs or Apache Sedona), geoprocessing, geometry tools, vector analysis, attribute manipulation, and optional CPU/GPU acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "GeoLattice Contributors"}
]
keywords = [
    "gis",
    "geospatial",
    "raster",
    "raster-algebra",
    "terrain-analysis",
    "hydrology",
    "watershed",
    "geomorphometry",
    "suitability",
    "fuzzy-overlay",
    "weighted-overlay",
    "multidimensional",
    "netcdf",
    "zarr",
    "zonal-stats",
    "network-analysis",
    "spatial-network",
    "routing",
    "accessibility",
    "geostatistics",
    "kriging",
    "variogram",
    "cokriging",
    "spatial-statistics",
    "esda",
    "moran",
    "gwr",
    "mgwr",
    "spatial-weights",
    "point-pattern",
    "segregation-analysis",
    "causal-inference",
    "spatial-causal-inference",
    "interference",
    "spatial-confounding",
    "web-gis",
    "cloud-native",
    "geoparquet",
    "spatial-database",
    "postgis",
    "spatialite",
    "geopackage",
    "duckdb",
    "spatial-sql",
    "pmtiles",
    "cog",
    "ogc-api",
    "vector",
    "vector-analysis",
    "attribute-table",
    "geoprocessing",
    "pointcloud",
    "remote-sensing",
    "super-resolution",
    "pansharpening",
    "texture-analysis",
    "image-classification",
    "semantic-segmentation",
    "object-detection",
    "change-detection",
    "earth-observation",
    "sentinel",
    "landsat",
    "sar",
    "radarsat",
    "sea-ice",
    "insar",
    "uav",
    "stac",
    "lidar",
    "point-cloud-segmentation",
    "pointnet",
    "hyperspectral",
    "imaging-spectroscopy",
    "spectral-unmixing",
    "emit",
    "enmap",
    "prisma",
    "foundation-models",
    "geospatial-embeddings",
    "alphaearth",
    "prithvi",
    "gpu",
    "jax",
    "parallel",
    "distributed",
    "dask",
    "cuda",
    "rapids",
    "spark",
    "sedona",
