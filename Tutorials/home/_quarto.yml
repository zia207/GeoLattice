project:
  type: website
  output-dir: _site
  resources:
    - assets
  render:
    - index.qmd
    - getting_started.qmd
    - user_guide.qmd
    - api_reference.qmd
    - data.md

website:
  title: "GeoLattice"
  description: "A Python library for unified geospatial analysis: vector and raster data, spatial analysis, spatial statistics, geostatistics, spatial databases, web GIS, distributed computing and remote sensing, with nine chapters of tutorials."
  site-url: https://zia207.github.io/GeoLattice
  repo-url: https://github.com/zia207/GeoLattice
  repo-branch: main
  favicon: assets/geolattice_logo.png
  page-navigation: false
  back-to-top-navigation: true
  search:
    location: sidebar
    type: textbox
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-By Zia Ahmed, Upatta Analytics, 2026"
  navbar:
    background: primary
    logo: assets/geolattice_logo.png
    logo-alt: "GeoLattice logo"
    title: "GeoLattice"
    left:
      - text: Home
        href: index.qmd
      - text: Getting Started
        href: getting_started.qmd
      - text: User Guide
        href: user_guide.qmd
      - text: API Reference
        href: api_reference.qmd
      - text: Data
        href: data.md
      - text: Tutorial
        menu:
          - text: "1. Vector Data"
            href: notebooks/01_02_vector_raster/index.html#vector-data
          - text: "2. Raster Data"
            href: notebooks/01_02_vector_raster/index.html#raster-data
          - text: "3. Spatial Analysis"
            href: notebooks/03_spatial_analysis/index.html
          - text: "4. Spatial Statistics"
            href: notebooks/04_spatial_statistics/index.html
          - text: "5. Geostatistics"
            href: notebooks/05_geostatistics/index.html
          - text: "6. Spatial Database"
            href: notebooks/06_spatialDB/index.html
          - text: "7. Web & Cloud GIS"
            href: notebooks/07_web_cloud_gis/index.html
          - text: "8. Distributed Spatial Analysis"
            href: notebooks/08_distributed_spatial/index.html
          - text: "9. Remote Sensing"
            href: notebooks/09_remote_sensing/index.html
      - icon: house
        href: https://sites.google.com/view/r-data-sci-env/home
        aria-label: Upatta Analytics
    right:
      - icon: github
        href: https://github.com/zia207/GeoLattice
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/zia-ahmed207
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:zia207@gmail.com
        aria-label: Email

  sidebar:
    logo: assets/geolattice_logo.png
    logo-alt: "GeoLattice logo"
    logo-href: index.qmd
    pinned: true
    border: true
    align: center
    search: true
    style: "docked"
    collapse-level: 2
    contents:
      - section: "Package Overview"
        href: index.qmd
        contents:
          - text: "Vector Data"
            href: notebooks/01_02_vector_raster/index.html#vector-data
          - text: "Raster Data"
            href: notebooks/01_02_vector_raster/index.html#raster-data
          - text: "Spatial Analysis"
            href: notebooks/03_spatial_analysis/index.html
          - text: "Spatial Statistics"
            href: notebooks/04_spatial_statistics/index.html
          - text: "Geostatistics"
            href: notebooks/05_geostatistics/index.html
          - text: "Spatial Database"
            href: notebooks/06_spatialDB/index.html
          - text: "Web & Cloud GIS"
            href: notebooks/07_web_cloud_gis/index.html
          - text: "Distributed Spatial Analysis"
            href: notebooks/08_distributed_spatial/index.html
          - text: "Remote Sensing"
            href: notebooks/09_remote_sensing/index.html
      - text: "---"
      - text: "Getting Started"
        href: getting_started.qmd
      - text: "User Guide"
        href: user_guide.qmd
      - text: "API Reference"
        href: api_reference.qmd
      - text: "Data"
        href: data.md

title-block-banner: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/home.css
    highlight-style: github
    fontsize: 1.1em
    linestretch: 1.6
    code-copy: true
    smooth-scroll: true
    toc: true
    toc-depth: 3
    toc-title: "On This Page"
    number-sections: false
    grid:
      sidebar-width: 300px
      body-width: 1100px
      margin-width: 250px
      gutter-width: 1.5rem
