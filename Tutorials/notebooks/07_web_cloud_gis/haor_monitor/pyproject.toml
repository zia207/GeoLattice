[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "haor-monitor"
version = "1.0.0"
description = "Scheduled Sentinel-2 monitoring of water and vegetation in Tanguar Haor, Bangladesh (GeoLattice Notebook 08_10)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "pystac-client>=0.8,<1",
    "planetary-computer>=1.0,<2",
    "odc-stac>=0.3.9,<0.6",
    "rasterio>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
haor-monitor = "haor_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
